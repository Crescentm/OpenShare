services:
  openshare:
    image: ${OPENSHARE_IMAGE:-ghcr.io/crescentm/openshare:latest}
    container_name: ${OPENSHARE_CONTAINER_NAME:-openshare}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENSHARE_HTTP_PORT:-8080}:8080"
    environment:
      OPENSHARE_SESSION_SECRET: ${OPENSHARE_SESSION_SECRET:-openshare-development-session-secret-change-me}
      OPENSHARE_SEARCH_ENGINE_ENABLED: ${OPENSHARE_SEARCH_ENGINE_ENABLED:-false}
      OPENSHARE_SEARCH_ENGINE_HOST: http://meilisearch:7700
      OPENSHARE_SEARCH_ENGINE_API_KEY: ${MEILI_MASTER_KEY:-openshare-development-master-key-change-me}
      OPENSHARE_SEARCH_ENGINE_INDEX_NAME: ${OPENSHARE_SEARCH_ENGINE_INDEX_NAME:-openshare_resources}
      OPENSHARE_SEARCH_ENGINE_SEMANTIC_PROFILE_PATH: ${OPENSHARE_SEARCH_ENGINE_SEMANTIC_PROFILE_PATH:-config/search.profile.openwhu.yaml}
      NO_PROXY: ${OPENSHARE_NO_PROXY:-localhost,127.0.0.1,::1,meilisearch,openshare-meilisearch,openshare,openshare-worker}
      no_proxy: ${OPENSHARE_NO_PROXY:-localhost,127.0.0.1,::1,meilisearch,openshare-meilisearch,openshare,openshare-worker}
      HOME: ${OPENSHARE_IMPORTS_CONTAINER_PATH:-/imports}
      GIN_MODE: release
    volumes:
      - ${OPENSHARE_DATA_PATH:-./data}:/data/openshare
      - ${OPENSHARE_IMPORTS_PATH:-./imports}:${OPENSHARE_IMPORTS_CONTAINER_PATH:-/imports}
  openshare-worker:
    image: ${OPENSHARE_IMAGE:-ghcr.io/crescentm/openshare:latest}
    container_name: ${OPENSHARE_WORKER_CONTAINER_NAME:-openshare-worker}
    restart: unless-stopped
    command: ["./openshare-worker"]
    environment:
      OPENSHARE_SESSION_SECRET: ${OPENSHARE_SESSION_SECRET:-openshare-development-session-secret-change-me}
      OPENSHARE_SEARCH_ENGINE_ENABLED: ${OPENSHARE_SEARCH_ENGINE_ENABLED:-false}
      OPENSHARE_SEARCH_ENGINE_HOST: http://meilisearch:7700
      OPENSHARE_SEARCH_ENGINE_API_KEY: ${MEILI_MASTER_KEY:-openshare-development-master-key-change-me}
      OPENSHARE_SEARCH_ENGINE_INDEX_NAME: ${OPENSHARE_SEARCH_ENGINE_INDEX_NAME:-openshare_resources}
      OPENSHARE_SEARCH_ENGINE_SEMANTIC_PROFILE_PATH: ${OPENSHARE_SEARCH_ENGINE_SEMANTIC_PROFILE_PATH:-config/search.profile.openwhu.yaml}
      NO_PROXY: ${OPENSHARE_NO_PROXY:-localhost,127.0.0.1,::1,meilisearch,openshare-meilisearch,openshare,openshare-worker}
      no_proxy: ${OPENSHARE_NO_PROXY:-localhost,127.0.0.1,::1,meilisearch,openshare-meilisearch,openshare,openshare-worker}
      HOME: ${OPENSHARE_IMPORTS_CONTAINER_PATH:-/imports}
      GIN_MODE: release
    volumes:
      - ${OPENSHARE_DATA_PATH:-./data}:/data/openshare
      - ${OPENSHARE_IMPORTS_PATH:-./imports}:${OPENSHARE_IMPORTS_CONTAINER_PATH:-/imports}
  meilisearch:
    image: getmeili/meilisearch:v1
    container_name: ${MEILI_CONTAINER_NAME:-openshare-meilisearch}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEILI_HTTP_PORT:-7700}:7700"
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-openshare-development-master-key-change-me}
    volumes:
      - ${MEILI_DATA_PATH:-./meili_data}:/meili_data
